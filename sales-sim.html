<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI 客户模拟训练中心</title>
  <style>
    :root {
      --bg: #e7eee9; --ink: #132019; --muted: #627068; --card: #ffffff;
      --accent: #0d7a5f; --warn: #b45309; --line: #d0ddd4; --danger: #b91c1c;
      --voice: #0f766e; --voice-live: #dc2626;
      --g-fail: #b91c1c; --g-pass: #b45309; --g-good: #0d7a5f; --g-great: #1d4ed8;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-text-size-adjust: 100%;
    }
    header {
      position: sticky; top: 0; z-index: 20;
      padding: 12px 14px calc(10px + env(safe-area-inset-top, 0px));
      background: #123c32; color: #fff;
      display: grid; gap: 8px;
    }
    .hdr-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    header h1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25; }
    header .sub { opacity: .78; font-size: 11px; margin-top: 3px; line-height: 1.35; }
    .hdr-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    header a, header button.linkish {
      color: #b7e4d5; font-size: 12px; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none;
    }
    main {
      max-width: 720px; margin: 0 auto;
      padding: 10px 10px calc(24px + var(--safe-b));
      display: grid; gap: 10px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 12px;
    }
    .card-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px;
    }
    .card-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; width: 100%; }
    select, input, button, textarea { font: inherit; }
    select, input[type="text"], input[type="password"] {
      padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; min-width: 0; width: 100%; font-size: 16px;
    }
    button {
      padding: 11px 14px; border-radius: 12px; border: 1px solid var(--accent);
      background: var(--accent); color: #fff; cursor: pointer; font-size: 14px;
    }
    button.secondary { background: #fff; color: var(--accent); }
    button.ghost { background: #f4f7f5; border-color: var(--line); color: var(--ink); }
    button.danger { background: #fff; color: var(--danger); border-color: #fecaca; }
    button.warn { background: var(--warn); border-color: var(--warn); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .pill {
      display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px;
      background: #e8f5f0; color: var(--accent); font-size: 12px; font-weight: 600;
    }
    header .pill { background: rgba(255,255,255,.14); color: #fff; }
    .field-grid { display: grid; gap: 8px; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .action-grid .span2 { grid-column: 1 / -1; }
    .action-grid button { min-height: 44px; width: 100%; }
    .meters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .meter {
      background: #f7faf8; border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    }
    .meter .l { font-size: 11px; color: var(--muted); }
    .meter .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
    .chat {
      min-height: 220px; max-height: min(48vh, 380px); overflow: auto;
      display: grid; gap: 8px; padding: 10px; background: #f4f8f6;
      border: 1px solid var(--line); border-radius: 14px;
    }
    .bubble { max-width: 88%; padding: 9px 11px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
    .bubble .meta { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .bubble.in { background: #fff; border: 1px solid var(--line); justify-self: start; }
    .bubble.out { background: rgba(13,122,95,.14); justify-self: end; }
    .bubble.coach { border: 1px dashed rgba(180,120,0,.55); background: #fff8e8; }
    .coach-box, .debrief {
      white-space: pre-wrap; font-size: 13px; line-height: 1.5;
      background: #f8faf9; border: 1px solid var(--line); border-radius: 12px; padding: 10px;
    }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .err { color: var(--danger); font-size: 13px; min-height: 1.2em; }
    .login-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .login-tabs button { background: #f3f7f5; color: var(--ink); border-color: var(--line); min-height: 42px; }
    .login-tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .login-fields { display: grid; gap: 10px; }
    .login-actions button { width: 100%; min-height: 48px; font-size: 16px; font-weight: 700; }
    .app-gated.hidden { display: none !important; }
    .composer { display: grid; gap: 10px; margin-top: 10px; }
    .text-row { display: flex; gap: 8px; align-items: stretch; }
    .text-row input { flex: 1; min-width: 0; }
    .text-row #btnSend { min-width: 70px; }
    .voice-panel {
      display: grid; gap: 8px; padding: 12px; border-radius: 16px;
      background: linear-gradient(180deg, #eef8f4 0%, #f7faf8 100%);
      border: 1px solid #c7e4d8;
    }
    .voice-main {
      width: 100%; min-height: 72px; border-radius: 18px; border: 0;
      background: var(--voice); color: #fff; font-size: 20px; font-weight: 800;
      letter-spacing: .02em; box-shadow: 0 10px 22px rgba(15, 118, 110, .24);
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .voice-main .ico {
      width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,.18);
      display: inline-grid; place-items: center; font-size: 15px;
    }
    .voice-main.recording {
      background: var(--voice-live);
      box-shadow: 0 10px 22px rgba(220, 38, 38, .28);
      animation: pulse 1.1s ease-in-out infinite;
    }
    .voice-main.uploading { opacity: .8; }
    @keyframes pulse { 50% { transform: scale(0.985); opacity: .9; } }
    .voice-sub { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .voice-status { font-size: 12px; color: var(--muted); flex: 1; line-height: 1.4; }
    .voice-status.live { color: var(--danger); font-weight: 650; }
    #btnVoiceCancel { min-height: 40px; flex-shrink: 0; }

    /* 看板：手机卡片 */
    .overview-scroll {
      display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      padding-bottom: 2px; margin-bottom: 10px;
    }
    .ov-chip {
      flex: 0 0 auto; min-width: 140px; background: #f4f8f6; border: 1px solid var(--line);
      border-radius: 14px; padding: 10px 12px;
    }
    .ov-chip .t { font-size: 12px; color: var(--muted); }
    .ov-chip .n { font-size: 20px; font-weight: 800; margin: 2px 0; }
    .ov-chip .s { font-size: 12px; color: var(--ink); }
    .legend {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px;
    }
    .grade {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 24px; padding: 2px 9px; border-radius: 999px;
      font-size: 12px; font-weight: 700; line-height: 1;
    }
    .grade.fail { background: #fee2e2; color: var(--g-fail); }
    .grade.pass { background: #ffedd5; color: var(--g-pass); }
    .grade.good { background: #dcfce7; color: var(--g-good); }
    .grade.great { background: #dbeafe; color: var(--g-great); }
    .grade.na { background: #f3f4f6; color: #6b7280; }
    .list { display: grid; gap: 10px; }
    .person-card, .recent-card {
      border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: #fff;
    }
    .person-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    }
    .person-name { font-size: 16px; font-weight: 800; }
    .person-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .stat-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px;
    }
    .stat {
      background: #f6f9f7; border-radius: 10px; padding: 8px 6px; text-align: center;
    }
    .stat .k { font-size: 11px; color: var(--muted); }
    .stat .v { font-size: 14px; font-weight: 750; margin-top: 2px; }
    .skill-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .skill-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-radius: 10px; background: #f6f9f7; font-size: 12px;
    }
    .skill-chip .n { color: var(--muted); }
    .section-label {
      margin: 14px 0 8px; font-size: 14px; font-weight: 750;
      display: flex; align-items: center; justify-content: space-between;
    }
    .recent-card {
      display: grid; gap: 6px;
    }
    .recent-card .line1 {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .recent-card .title { font-size: 14px; font-weight: 700; }
    .recent-card .sub { font-size: 12px; color: var(--muted); }
    .empty {
      text-align: center; color: var(--muted); font-size: 13px; padding: 18px 8px;
      background: #f7faf8; border-radius: 12px;
    }
    .notif-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-top: 8px; background: #fff; }
    .notif-item.unread { border-color: #86efac; background: #f0fdf4; }
    .notif-item pre { white-space: pre-wrap; margin: 6px 0 0; font: inherit; font-size: 12px; color: var(--muted); }
    .rank-line { margin-top: 8px; }

    @media (min-width: 720px) {
      main { max-width: 860px; padding: 16px; gap: 12px; }
      .meters { grid-template-columns: repeat(4, 1fr); }
      .field-grid { grid-template-columns: 1fr 1.4fr; }
      .action-grid { grid-template-columns: repeat(4, 1fr); }
      .action-grid .span2 { grid-column: auto; }
      .list.people { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="hdr-top">
      <div>
        <h1>AI 客户模拟训练中心</h1>
        <div class="sub">本页登录 · 大按钮语音 · 训后通知</div>
      </div>
      <span class="pill" id="modePill">检测中…</span>
    </div>
    <div class="hdr-actions">
      <a href="/platform-admin.html" id="backLink">销售 CRM</a>
      <button type="button" class="linkish" id="logoutBtn" style="display:none">退出登录</button>
      <button type="button" class="linkish" id="btnNotif" style="display:none">通知 <span id="notifBadge">0</span></button>
    </div>
  </header>
  <main>
    <div class="card" id="loginCard">
      <strong style="font-size:16px">登录后开始训练</strong>
      <p class="hint" style="margin:6px 0 12px">仅供销售 / 客服团队使用（与 CRM 同一套账号）。登录后可在页内切换销售陪练或客服陪练。</p>
      <div class="login-fields">
        <label>账号<input id="loginUser" type="text" autocomplete="username" placeholder="销售/客服账号"></label>
        <label>密码<input id="loginPass" type="password" autocomplete="current-password" placeholder="密码"></label>
        <div class="login-actions">
          <button type="button" id="loginBtn">登录并进入训练</button>
        </div>
        <p class="err" id="loginErr"></p>
      </div>
    </div>

    <div class="card app-gated hidden" id="setupCard">
      <div class="card-head">
        <div>
          <h2>开始一场训练</h2>
          <p class="hint" style="margin:4px 0 0" id="rankPill">职级：—</p>
        </div>
      </div>
      <div class="field-grid">
        <label>轨道
          <select id="track">
            <option value="sales">销售陪练</option>
            <option value="cs">客服陪练</option>
            <option value="consult">咨询答疑陪练</option>
          </select>
        </label>
        <label>人格 / 场景
          <select id="persona"></select>
        </label>
      </div>
      <div class="action-grid">
        <button type="button" id="btnNext" class="ghost">下一场推荐</button>
        <button type="button" id="btnFinish" class="secondary" disabled>结束复盘</button>
        <button type="button" id="btnStart" class="warn span2">开始训练</button>
      </div>
      <p class="hint" id="nextHint" style="margin:8px 0 0"></p>
      <div class="meters">
        <div class="meter"><div class="l">情绪</div><div class="v" id="mEmotion">—</div></div>
        <div class="meter"><div class="l">信任</div><div class="v" id="mTrust">—</div></div>
        <div class="meter"><div class="l">成交就绪</div><div class="v" id="mClose">—</div></div>
        <div class="meter"><div class="l">满意度</div><div class="v" id="mSat">—</div></div>
      </div>
    </div>

    <div class="card app-gated hidden" id="chatCard">
      <div class="coach-box" id="coachBox" style="display:none;margin-bottom:8px"></div>
      <div class="chat" id="chat"></div>
      <div class="composer">
        <div class="text-row">
          <input type="text" id="input" placeholder="输入你的回复…" disabled />
          <button type="button" id="btnSend" disabled>发送</button>
        </div>
        <div class="voice-panel">
          <button type="button" id="btnVoice" class="voice-main" disabled>
            <span class="ico" aria-hidden="true">🎙</span>
            <span id="btnVoiceLabel">语音输入</span>
          </button>
          <div class="voice-sub">
            <span class="voice-status" id="voiceStatus">点「语音输入」说话，说完再点「结束并发送」。</span>
            <button type="button" id="btnVoiceCancel" class="danger" disabled style="display:none">取消</button>
          </div>
        </div>
      </div>
      <p class="err" id="err"></p>
    </div>

    <div class="card app-gated hidden" id="debriefCard" style="display:none">
      <h2 style="margin:0 0 8px;font-size:16px">赛后复盘</h2>
      <div class="debrief" id="debrief"></div>
    </div>

    <div class="card app-gated hidden" id="notifCard" style="display:none">
      <div class="card-head">
        <h2>培训报告通知</h2>
        <button type="button" id="btnNotifRefresh" class="ghost">刷新</button>
      </div>
      <div id="notifList"></div>
    </div>

    <div class="card app-gated hidden" id="dashCard" style="display:none">
      <div class="card-head">
        <div>
          <h2>模拟训练看板</h2>
          <p class="hint" style="margin:4px 0 0">按姓名查看训练进度与等级</p>
        </div>
        <button type="button" id="btnDash" class="ghost">刷新</button>
      </div>
      <div class="legend" id="gradeLegend"></div>
      <div class="overview-scroll" id="dashOverview"></div>
      <div class="section-label"><span>人员进度</span></div>
      <div class="list people" id="dashPeople"></div>
      <div class="section-label"><span>最近完成</span></div>
      <div class="list" id="dashRecent"></div>
    </div>

  </main>
  <script>
    const state = {
      mode: null,
      base: '',
      sessionId: null,
      voice: { recorder: null, chunks: [], stream: null, startedAt: 0, timer: null, phase: 'idle' },
    };

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function platformToken() {
      return localStorage.getItem('platform_admin_token') || localStorage.getItem('hrms_platform_token') || '';
    }
    function token() {
      return platformToken();
    }
    function loginErrorText(data, status) {
      const code = data?.error || data?.message || '';
      if (code === 'invalid_credentials' || status === 401) return '账号或密码错误';
      if (code === 'missing_credentials') return '请输入账号和密码';
      return data?.message || data?.error || `登录失败(${status || ''})`;
    }
    async function api(path, opts = {}) {
      const headers = {
        ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}),
        Authorization: `Bearer ${token()}`,
      };
      const res = await fetch(state.base + path, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && data.ok !== true) throw new Error(data.message || data.error || `http_${res.status}`);
      return data;
    }
    function setErr(msg) { $('err').textContent = msg || ''; }
    function setLoginErr(msg) { $('loginErr').textContent = msg || ''; }

    function gradeClass(g) {
      if (g === '不合格') return 'fail';
      if (g === '合格') return 'pass';
      if (g === '优秀') return 'good';
      if (g === '卓越') return 'great';
      return 'na';
    }
    function gradeBadge(g) {
      const label = g || '—';
      return `<span class="grade ${gradeClass(g)}">${esc(label)}</span>`;
    }
    function renderSkills(skillsLine, skillsGrades) {
      if (skillsGrades && typeof skillsGrades === 'object' && Object.keys(skillsGrades).length) {
        const labels = {
          questioning: '提问', listening: '倾听', value: '价值', closing: '成交',
          empathy: '安抚', diagnosis: '定位', resolution: '闭环', retention: '维护',
          solution_value: '方案价值', implementation: '落地实施',
          communication: '沟通', product_knowledge: '产品知识', service_awareness: '服务意识', recommendation: '推荐',
        };
        return Object.entries(skillsGrades).map(([k, g]) => `
          <span class="skill-chip"><span class="n">${esc(labels[k] || k)}</span>${gradeBadge(g)}</span>
        `).join('');
      }
      // fallback: "提问能力 合格 · ..."
      const parts = String(skillsLine || '').split('·').map((s) => s.trim()).filter(Boolean);
      return parts.map((p) => {
        const m = p.match(/^(.+?)\s+(不合格|合格|优秀|卓越)$/);
        if (!m) return `<span class="skill-chip">${esc(p)}</span>`;
        return `<span class="skill-chip"><span class="n">${esc(m[1].replace(/能力$/, ''))}</span>${gradeBadge(m[2])}</span>`;
      }).join('');
    }

    function showApp(on) {
      document.querySelectorAll('.app-gated').forEach((el) => {
        if (el.id === 'debriefCard' || el.id === 'notifCard') return;
        if (el.id === 'dashCard') {
          el.style.display = on ? '' : 'none';
          el.classList.toggle('hidden', !on);
          return;
        }
        el.classList.toggle('hidden', !on);
      });
      $('loginCard').style.display = on ? 'none' : '';
      $('logoutBtn').style.display = on ? '' : 'none';
      $('btnNotif').style.display = on ? '' : 'none';
    }

    function detectMode() {
      const platform = platformToken();
      if (platform) {
        state.mode = 'platform';
        state.base = '/api/admin/sales-sim';
        $('modePill').textContent = '销售/客服';
        $('track').disabled = false;
        $('backLink').href = '/platform-admin.html';
        $('backLink').textContent = '销售 CRM';
        showApp(true);
        return true;
      }
      state.mode = null;
      state.base = '';
      $('modePill').textContent = '未登录';
      showApp(false);
      setErr('');
      return false;
    }

    async function doLogin() {
      setLoginErr('');
      const username = $('loginUser').value.trim();
      const password = $('loginPass').value;
      if (!username || !password) throw new Error('请输入账号和密码');
      $('loginBtn').disabled = true;
      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) throw new Error(loginErrorText(data, res.status));
        localStorage.setItem('platform_admin_token', data.token);
        localStorage.setItem('hrms_platform_token', data.token);
        if (data.admin) localStorage.setItem('platform_admin_account', JSON.stringify(data.admin));
        $('loginPass').value = '';
        await boot();
      } finally {
        $('loginBtn').disabled = false;
      }
    }

    function doLogout() {
      localStorage.removeItem('platform_admin_token');
      localStorage.removeItem('hrms_platform_token');
      localStorage.removeItem('platform_admin_account');
      state.sessionId = null;
      state.mode = null;
      detectMode();
      setLoginErr('');
      $('modePill').textContent = '未登录';
    }

    function setActive(on) {
      $('input').disabled = !on;
      $('btnSend').disabled = !on;
      $('btnVoice').disabled = !on || state.voice.phase === 'uploading';
      $('btnFinish').disabled = !on;
      $('btnStart').disabled = on;
      if (!on) resetVoiceUi();
    }

    function meters(s = {}) {
      $('mEmotion').textContent = s.emotion ?? '—';
      $('mTrust').textContent = s.trust ?? '—';
      $('mClose').textContent = s.close_readiness ?? '—';
      $('mSat').textContent = s.satisfaction ?? '—';
    }

    function bubble(role, content, meta) {
      const div = document.createElement('div');
      div.className = `bubble ${role === 'trainee' ? 'out' : 'in'}${role === 'coach' ? ' coach' : ''}`;
      div.innerHTML = `<span class="meta">${esc(meta || role)}</span>${esc(content)}`;
      $('chat').appendChild(div);
      $('chat').scrollTop = $('chat').scrollHeight;
    }

    function playMp3(b64) {
      if (!b64) return;
      try { new Audio(`data:audio/mpeg;base64,${b64}`).play().catch(() => {}); } catch (_) {}
    }

    function personaOptionLabel(p) {
      const diff = p.difficulty_label || (`难度${p.difficulty ?? 1}`);
      return `${diff} · ${p.title}`;
    }

    async function refreshRank() {
      const track = $('track').value;
      const data = await api(`/rank?track=${encodeURIComponent(track)}`);
      const next = data.next ? ` · 距${data.next.rank_label}还差${data.next.need_minutes}分钟` : '';
      $('rankPill').textContent = `职级：${data.rank_label || '—'}（${data.effective_minutes || 0}分钟${next}）`;
    }

    async function loadPersonas() {
      const track = $('track').value;
      const data = await api(`/personas?track=${encodeURIComponent(track)}&audience=internal`);
      $('persona').innerHTML = (data.personas || []).map((p) =>
        `<option value="${esc(p.persona_key)}">${esc(personaOptionLabel(p))}</option>`
      ).join('') || '<option value="">暂无场景</option>';
    }

    async function loadNext() {
      const track = $('track').value;
      const data = await api(`/curriculum/next?track=${encodeURIComponent(track)}`);
      if (data.recommended) {
        $('persona').value = data.recommended.persona_key;
        $('nextHint').textContent = data.recommended.reason || '';
      } else {
        $('nextHint').textContent = '暂无推荐，请手动选择场景';
      }
    }

    async function start() {
      setErr('');
      const body = { persona_key: $('persona').value };
      if (state.mode === 'platform') body.track = $('track').value;
      const data = await api('/sessions', { method: 'POST', body: JSON.stringify(body) });
      if (!data.ok) throw new Error(data.message || data.error);
      state.sessionId = data.session.id;
      $('chat').innerHTML = '';
      $('debriefCard').style.display = 'none';
      $('debriefCard').classList.add('hidden');
      $('coachBox').style.display = 'none';
      bubble('customer', data.opening.content, data.persona?.title || '客户');
      meters(data.session);
      setActive(true);
      setVoiceStatus('点「语音输入」开始说话，说完再点「结束并发送」。');
      $('chatCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showDebrief(d, rank, next, notification) {
      const skillZh = {
        questioning: '提问能力', listening: '倾听能力', value: '价值表达', closing: '成交推进',
        solution_value: '方案价值', implementation: '落地实施',
        empathy: '情绪安抚', diagnosis: '问题定位', resolution: '解决闭环', retention: '关系维护',
        communication: '沟通能力', product_knowledge: '产品知识', service_awareness: '服务意识', recommendation: '推荐能力',
      };
      const skillLine = d.skills_line
        || (d.skills_labeled
          ? Object.entries(d.skills_labeled).map(([k, v]) => `${k} ${v}`).join(' · ')
          : Object.entries(d.skills || {}).map(([k, v]) => `${skillZh[k] || k} ${v}`).join(' · '));
      const improvements = (d.improvements || []).map((x, i) =>
        `${i + 1}. 【${x.principle_label || x.principle_id}】${x.detail}`
      ).join('\n') || '暂无';
      const strengths = (d.strengths || []).map((x) =>
        `· ${x.detail}${x.principle_label ? `（${x.principle_label}）` : ''}`
      ).join('\n') || '暂无';
      const reps = (d.replacements || []).map((r) =>
        `❌ ${r.original}\n✅ ${r.suggested}\n（${r.source_label || ''}）`
      ).join('\n\n') || '暂无';
      const rankLine = rank ? `\n职级：${rank.rank_label}${rank.promoted ? '（升级）' : ''}${rank.demoted ? '（降级）' : ''}` : '';
      const nextLine = next?.recommended
        ? `\n\n下一场推荐：${next.recommended.title}\n${next.recommended.reason || ''}`
        : '';
      const notifyLine = notification?.ok ? '\n\n已发送培训报告通知给培训人。' : '';
      $('debriefCard').style.display = '';
      $('debriefCard').classList.remove('hidden');
      const grade = d.score_grade || '—';
      $('debrief').innerHTML = `
        <div style="margin-bottom:8px">本场评定 ${gradeBadge(grade)}</div>
        <div class="skill-wrap" style="margin:0 0 10px">${renderSkills(skillLine, d.skills_grades || d.skills_labeled)}</div>
        <pre style="margin:0;white-space:pre-wrap;font:inherit;font-size:13px">${esc([
          rankLine.trim(),
          '', '优点：', strengths, '', '需要提升：', improvements, '', '参考话术：', reps, nextLine, notifyLine,
        ].filter(Boolean).join('\n'))}</pre>
      `;
      $('debriefCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function applyTurn(data) {
      if (data.coach?.length) {
        const msg = data.coach.map((c) => c.message).join('；');
        $('coachBox').style.display = '';
        $('coachBox').textContent = '实时教练：' + msg;
        bubble('coach', msg, '教练');
      }
      if (data.customer?.content) {
        bubble('customer', data.customer.content, '客户');
        playMp3(data.customer_audio_base64);
      }
      if (data.state) meters(data.state);
      if (data.ended) {
        showDebrief(data.debrief || {}, data.rank, data.curriculum_next, data.notification);
        setActive(false);
        refreshRank().catch(() => {});
        loadNotifications().catch(() => {});
        loadDashboard().catch(() => {});
      }
    }

    async function send() {
      const text = $('input').value.trim();
      if (!text || !state.sessionId) return;
      $('input').value = '';
      bubble('trainee', text, '我');
      const data = await api(`/sessions/${state.sessionId}/turn`, {
        method: 'POST', body: JSON.stringify({ text, tts: true }),
      });
      if (!data.ok) throw new Error(data.message || data.error);
      applyTurn(data);
    }

    async function finish() {
      if (!state.sessionId) return;
      if (state.voice.phase === 'recording') await cancelVoice();
      const data = await api(`/sessions/${state.sessionId}/finish`, {
        method: 'POST', body: JSON.stringify({ outcome: 'completed' }),
      });
      if (!data.ok) throw new Error(data.message || data.error);
      showDebrief(data.debrief || {}, data.rank, data.curriculum_next, data.notification);
      setActive(false);
      await refreshRank();
      await loadNotifications().catch(() => {});
      await loadDashboard().catch(() => {});
      if (data.curriculum_next?.recommended) {
        $('persona').value = data.curriculum_next.recommended.persona_key;
        $('nextHint').textContent = data.curriculum_next.recommended.reason || '';
      }
    }

    function setVoiceStatus(text, live = false) {
      const el = $('voiceStatus');
      el.textContent = text;
      el.classList.toggle('live', !!live);
    }
    function clearVoiceTimer() {
      if (state.voice.timer) { clearInterval(state.voice.timer); state.voice.timer = null; }
    }
    function stopTracks() {
      try { state.voice.stream?.getTracks?.().forEach((t) => t.stop()); } catch (_) {}
      state.voice.stream = null;
    }
    function resetVoiceUi() {
      clearVoiceTimer();
      stopTracks();
      state.voice.recorder = null;
      state.voice.chunks = [];
      state.voice.phase = 'idle';
      const btn = $('btnVoice');
      btn.classList.remove('recording', 'uploading');
      $('btnVoiceLabel').textContent = '语音输入';
      btn.disabled = !state.sessionId;
      $('btnVoiceCancel').style.display = 'none';
      $('btnVoiceCancel').disabled = true;
      setVoiceStatus('点「语音输入」说话，说完再点「结束并发送」。');
    }

    async function startVoice() {
      if (!state.sessionId || state.voice.phase !== 'idle') return;
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('当前浏览器不支持录音');
      setErr('');
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '');
      state.voice.chunks = [];
      state.voice.stream = stream;
      state.voice.recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      state.voice.recorder.ondataavailable = (e) => { if (e.data?.size) state.voice.chunks.push(e.data); };
      state.voice.recorder.start(250);
      state.voice.startedAt = Date.now();
      state.voice.phase = 'recording';
      $('btnVoice').classList.add('recording');
      $('btnVoiceLabel').textContent = '结束并发送';
      $('btnVoiceCancel').style.display = '';
      $('btnVoiceCancel').disabled = false;
      clearVoiceTimer();
      state.voice.timer = setInterval(() => {
        const sec = Math.floor((Date.now() - state.voice.startedAt) / 1000);
        setVoiceStatus(`录音中 ${sec} 秒… 说完再点大按钮发送`, true);
      }, 200);
      setVoiceStatus('录音中 0 秒…', true);
    }

    async function cancelVoice() {
      if (state.voice.phase !== 'recording') return;
      try {
        if (state.voice.recorder && state.voice.recorder.state !== 'inactive') {
          await new Promise((r) => { state.voice.recorder.onstop = r; state.voice.recorder.stop(); });
        }
      } catch (_) {}
      resetVoiceUi();
      setVoiceStatus('已取消，可再次点「语音输入」或改打字。');
    }

    async function stopAndSendVoice() {
      if (state.voice.phase !== 'recording' || !state.voice.recorder) return;
      if (Date.now() - state.voice.startedAt < 700) {
        setErr('录音太短，请至少说完一句话再结束');
        return;
      }
      clearVoiceTimer();
      state.voice.phase = 'uploading';
      $('btnVoice').disabled = true;
      $('btnVoice').classList.add('uploading');
      $('btnVoiceCancel').disabled = true;
      $('btnVoiceLabel').textContent = '识别中…';
      setVoiceStatus('正在识别语音…');
      await new Promise((r) => { state.voice.recorder.onstop = r; state.voice.recorder.stop(); });
      const blob = new Blob(state.voice.chunks, { type: state.voice.recorder.mimeType || 'audio/webm' });
      stopTracks();
      state.voice.recorder = null;
      state.voice.chunks = [];
      if (!blob.size) {
        resetVoiceUi();
        setErr('没录到声音，请再试一次或改打字');
        return;
      }
      try {
        const fd = new FormData();
        fd.append('audio', blob, 'utt.webm');
        const res = await fetch(`${state.base}/sessions/${state.sessionId}/turn-voice`, {
          method: 'POST', headers: { Authorization: `Bearer ${token()}` }, body: fd,
        });
        const data = await res.json().catch(() => ({}));
        if (!data.ok) {
          resetVoiceUi();
          setErr(data.message || '没听清，请再说一次或改打字');
          return;
        }
        setErr('');
        if (data.transcript) {
          $('input').value = data.transcript;
          bubble('trainee', data.transcript, '我（语音）');
        }
        applyTurn(data);
        resetVoiceUi();
        setVoiceStatus('识别成功。可继续语音或打字。');
      } catch (e) {
        resetVoiceUi();
        setErr(e.message || '语音上传失败');
      }
    }

    function bindVoice() {
      $('btnVoice').onclick = () => {
        if (state.voice.phase === 'idle') startVoice().catch((e) => setErr(e.message));
        else if (state.voice.phase === 'recording') stopAndSendVoice().catch((e) => setErr(e.message));
      };
      $('btnVoiceCancel').onclick = () => cancelVoice().catch((e) => setErr(e.message));
    }

    async function loadNotifications() {
      const data = await api('/notifications?limit=20');
      $('notifBadge').textContent = String(data.unread || 0);
      const items = data.items || [];
      if (!items.length) {
        $('notifList').innerHTML = '<div class="empty">暂无培训报告通知</div>';
        return;
      }
      $('notifList').innerHTML = items.map((n) => `
        <div class="notif-item ${n.read_at ? '' : 'unread'}">
          <div class="row" style="justify-content:space-between">
            <strong style="font-size:13px">${esc(n.title)}</strong>
            <span class="hint">${esc(fmtTime(n.created_at))}</span>
          </div>
          <pre>${esc(n.message)}</pre>
          ${n.read_at ? '' : `<button type="button" class="ghost mark-read" data-id="${n.id}" style="margin-top:8px;width:100%">标为已读</button>`}
        </div>
      `).join('');
      $('notifList').querySelectorAll('.mark-read').forEach((btn) => {
        btn.onclick = async () => {
          await api(`/notifications/${btn.dataset.id}/read`, { method: 'POST', body: '{}' });
          await loadNotifications();
        };
      });
    }

    function fmtTime(v) {
      if (!v) return '—';
      return String(v).replace('T', ' ').slice(0, 16);
    }

    async function loadDashboard() {
      if (state.mode !== 'platform') return;
      const track = $('track').value;
      const data = await api(`/dashboard?track=${encodeURIComponent(track)}`);

      $('gradeLegend').innerHTML = (data.grade_scale || [
        { grade: '不合格', rule: '<80' },
        { grade: '合格', rule: '80–90' },
        { grade: '优秀', rule: '91–95' },
        { grade: '卓越', rule: '>95' },
      ]).map((g) => `${gradeBadge(g.grade)}<span class="hint">${esc(g.rule || '')}</span>`).join('');

      $('dashOverview').innerHTML = (data.overview || []).map((o) => `
        <div class="ov-chip">
          <div class="t">${esc(o.track_label)}</div>
          <div class="n">${o.trainees || 0} 人</div>
          <div class="s">完成 ${o.finished_sessions || 0} 场 · ${gradeBadge(o.avg_grade)}</div>
        </div>
      `).join('') || '<div class="empty" style="min-width:100%">暂无汇总</div>';

      const people = data.people || [];
      $('dashPeople').innerHTML = people.length ? people.map((p) => `
        <article class="person-card">
          <div class="person-top">
            <div>
              <div class="person-name">${esc(p.display_name || p.username)}</div>
              <div class="person-meta">${esc(p.track_label)} · ${esc(p.rank_label)}</div>
            </div>
            ${gradeBadge(p.avg_grade)}
          </div>
          <div class="stat-row">
            <div class="stat"><div class="k">完成场次</div><div class="v">${p.sessions_finished || 0}/${p.sessions_total || 0}</div></div>
            <div class="stat"><div class="k">最高等级</div><div class="v">${gradeBadge(p.best_grade)}</div></div>
            <div class="stat"><div class="k">有效分钟</div><div class="v">${p.effective_minutes || 0}</div></div>
          </div>
          <div class="skill-wrap">${renderSkills(p.skills_line, p.skills_grades) || '<span class="hint">暂无能力数据</span>'}</div>
        </article>
      `).join('') : '<div class="empty">暂无人员训练记录</div>';

      const recent = data.recent || [];
      $('dashRecent').innerHTML = recent.length ? recent.map((r) => `
        <article class="recent-card">
          <div class="line1">
            <div class="title">${esc(r.display_name || r.username)}</div>
            ${gradeBadge(r.score_grade)}
          </div>
          <div class="sub">${esc(r.persona_title || r.persona_key || '场景')} · ${esc(r.difficulty_label || '')}</div>
          <div class="sub">${esc(fmtTime(r.finished_at))}</div>
        </article>
      `).join('') : '<div class="empty">暂无最近完成</div>';
    }

    async function boot() {
      if (!detectMode()) return;
      await loadPersonas();
      await refreshRank();
      await loadNext().catch(() => {});
      await loadNotifications().catch(() => {});
      if (state.mode === 'platform') await loadDashboard().catch(() => {});
    }

    $('loginBtn').onclick = () => doLogin().catch((e) => setLoginErr(e.message));
    $('loginPass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doLogin().catch((err) => setLoginErr(err.message)); }
    });
    $('logoutBtn').onclick = () => doLogout();
    $('track').onchange = () => boot().catch((e) => setErr(e.message));
    $('btnNext').onclick = () => loadNext().catch((e) => setErr(e.message));
    $('btnStart').onclick = () => start().catch((e) => setErr(e.message));
    $('btnFinish').onclick = () => finish().catch((e) => setErr(e.message));
    $('btnSend').onclick = () => send().catch((e) => setErr(e.message));
    $('btnDash').onclick = () => loadDashboard().catch((e) => setErr(e.message));
    $('btnNotif').onclick = () => {
      const show = $('notifCard').style.display === 'none' || $('notifCard').classList.contains('hidden');
      $('notifCard').style.display = show ? '' : 'none';
      $('notifCard').classList.toggle('hidden', !show);
      if (show) {
        loadNotifications().catch((e) => setErr(e.message));
        $('notifCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
    $('btnNotifRefresh').onclick = () => loadNotifications().catch((e) => setErr(e.message));
    $('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); send().catch((err) => setErr(err.message)); }
    });
    bindVoice();
    boot().catch((e) => setErr(e.message));
  </script>
</body>
</html>

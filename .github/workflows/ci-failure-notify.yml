# P0.4：main CI 失败时开/更新 sticky Issue；转绿时自动关闭，避免「狼来了」疲劳。
# 飞书推送依赖生产密钥，Actions 里默认只做 GitHub 侧可见性；若配置了 FEISHU_CI_WEBHOOK 则额外推送。
name: CI Failure Notify

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Summarize failure
        id: summary
        run: |
          echo "## CI 失败告警" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **workflow**: ${{ github.event.workflow_run.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **run**: ${{ github.event.workflow_run.html_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **head_sha**: \`${{ github.event.workflow_run.head_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **actor**: ${{ github.event.workflow_run.actor.login }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "main 上 CI 红了；请先修闸门再继续拆代码。" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            // 连续失败 ≥3：升级标题/正文，避免「红灯继续推」再次无人停
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              per_page: 10,
              status: 'completed',
            });
            let streak = 0;
            for (const r of runs.data.workflow_runs || []) {
              if (r.conclusion === 'failure') streak += 1;
              else break;
            }
            const escalated = streak >= 3;
            const title = escalated
              ? `🚨🚨 CI red on main ×${streak} — STOP shipping until green`
              : '🚨 CI red on main — fix before deploy';
            const body = [
              escalated ? '## ⛔ ESCALATED: consecutive CI failures on `main`' : '## CI failure on `main`',
              '',
              `Consecutive failures: **${streak}**`,
              `Latest failed run: ${{ github.event.workflow_run.html_url }}`,
              `SHA: \`${{ github.event.workflow_run.head_sha }}\``,
              `Actor: @${{ github.event.workflow_run.actor.login }}`,
              '',
              escalated
                ? '**Discipline**: do not push more feature/test commits until CI is green. Fix the red first.'
                : 'main 上 CI 红了；请先修闸门再继续拆代码。',
              '',
              '_Auto-updated by `ci-failure-notify.yml`. Auto-closes when CI turns green._',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });
            // 兼容旧标题与升级标题
            const existing = issues.data.find((i) =>
              i.title.startsWith('🚨 CI red on main') || i.title.startsWith('🚨🚨 CI red on main'));
            const labels = escalated ? ['ci-failure', 'ci-failure-escalated'] : ['ci-failure'];
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                labels,
              }).catch(async () => {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              try {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels,
                });
              } catch (e) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            }

      - name: Optional Feishu webhook
        env:
          FEISHU_CI_WEBHOOK: ${{ secrets.FEISHU_CI_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_CI_WEBHOOK" ]; then
            echo "FEISHU_CI_WEBHOOK not set; skip"
            exit 0
          fi
          curl -sS -X POST "$FEISHU_CI_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"CI failed on main\\n${{ github.event.workflow_run.html_url }}\\nSHA ${{ github.event.workflow_run.head_sha }}\"}}" \
            || true

  close-on-success:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close open ci-failure issues
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 10,
            });
            const matches = issues.data.filter((i) =>
              i.title.startsWith('🚨 CI red on main') || i.title.startsWith('🚨🚨 CI red on main'));
            if (!matches.length) {
              core.info('No open ci-failure issue to close');
              return;
            }
            const comment = [
              '## CI green again',
              '',
              `Successful run: ${{ github.event.workflow_run.html_url }}`,
              `SHA: \`${{ github.event.workflow_run.head_sha }}\``,
              '',
              '_Auto-closed by `ci-failure-notify.yml`._',
            ].join('\n');
            for (const issue of matches) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed issue #${issue.number}`);
            }

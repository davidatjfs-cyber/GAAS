name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 必须 >=22：server 测试脚本依赖 --test-force-exit；Node 18 会 bad option 并零执行闸门
          node-version: '22'
          check-latest: false
      - name: Assert Node runtime can actually run test gates
        run: node scripts/assert-ci-runtime.mjs
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Unit coverage ratchet (Phase 0 floor; only raise)
        run: npm run test:coverage
      - name: Prove critical unit gates executed (not vacuously skipped)
        run: |
          set -e
          # 重新跑闸门文件并要求至少 1 条 pass，防止 find/脚本漂移导致「npm test 绿但闸门没进进程」
          cd server
          out=$(node --test --test-force-exit test/shared-table-writers-gate.test.mjs test/ensure-ddl-freeze.test.mjs test/coverage-ratchet-gate.test.mjs test/console-log-ratchet.test.mjs test/function-size-ratchet.test.mjs)
          echo "$out"
          echo "$out" | grep -q 'SHARED_TABLE_WRITERS'
          echo "$out" | grep -q 'domains/ 不得在 ensure'
          echo "$out" | grep -q 'coverage-ratchet'
          echo "$out" | grep -q 'console.log'
          echo "$out" | grep -q 'function-size-ratchet'
          echo "$out" | grep -Eq 'fail 0'

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gaas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: false
      - name: Assert Node runtime can actually run test gates
        run: node scripts/assert-ci-runtime.mjs
      - run: npm ci
      - run: DATABASE_URL=$TEST_DATABASE_URL APP_ENV=development node migrate.js
        working-directory: server
      - name: 创建被测应用专用的非superuser角色（否则RLS测试形同虚设）
        run: psql "$TEST_DATABASE_URL" -f server/test/integration/helpers/setup-test-role.sql
      # Wave A：一次跑单测+集成并采集合并覆盖率（观测口径，不改单测棘轮）。
      # 本 job 用合并脚本替代单独的 test:integration，避免集成套件跑两遍。
      - name: Unit + integration (merged coverage observe)
        run: npm run test:coverage:merged
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/gaas_test
          TEST_APP_DATABASE_URL: postgres://gaas_app_test:gaas_app_test_pw@localhost:5432/gaas_test
      - name: Upload merged coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-summary
          path: |
            server/coverage/merged-summary.json
            server/coverage/merged/coverage-summary.json
          if-no-files-found: warn

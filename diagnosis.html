<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门店经营诊断 - HRMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:#2d3436;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);color:#fff;padding:16px 16px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:600}
.header .period{font-size:13px;opacity:.75;display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%}
.header .period input[type="date"]{margin:0!important}
.container{max-width:1200px;margin:16px auto;padding:0 12px}
.stores-grid{display:grid;grid-template-columns:1fr;gap:14px}
.store-card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid #e8e8e8}
.store-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.store-card h3{font-size:16px;margin-bottom:12px;color:#1a1a2e;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.store-card h3 .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.store-card .headline{font-size:13px;color:#555;margin-bottom:14px;line-height:1.5}
.badge-green{background:#e8f8e8;color:#2d8a3e}
.badge-red{background:#fde8e8;color:#c0392b}
.badge-yellow{background:#fef3e4;color:#e67e22}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.metric{background:#f8f9fb;border-radius:8px;padding:10px;text-align:center}
.metric .value{font-size:16px;font-weight:700;color:#1a1a2e}
.metric .label{font-size:11px;color:#888;margin-top:4px}
.metric .change{font-size:11px;margin-left:4px}
@media (min-width:768px){
  .header{padding:20px 32px;flex-wrap:nowrap}
  .header h1{font-size:20px}
  .header .period{width:auto}
  .container{margin:24px auto;padding:0 24px}
  .stores-grid{grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:20px}
  .store-card{padding:24px}
  .store-card h3{font-size:17px}
  .metrics{grid-template-columns:repeat(4,1fr)}
  .metric{padding:12px}
  .metric .value{font-size:18px}
}
.change-up{color:#2d8a3e}
.change-down{color:#c0392b}
.issues{margin-bottom:12px}
.issue-tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px;font-weight:500}
.issue-high{background:#fde8e8;color:#c0392b}
.issue-medium{background:#fef3e4;color:#e67e22}
.recommendations{margin-top:8px}
.rec-item{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #f0f0f0}
.rec-item:last-child{border-bottom:none}
.rec-icon{font-size:14px;flex-shrink:0;width:20px}
.detail-panel{display:none;position:fixed;top:0;right:0;width:100%;height:100vh;background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.15);overflow-y:auto;z-index:1000;padding:20px}
.detail-panel.show{display:block}
@media (min-width:768px){
  .detail-panel{width:560px;padding:32px}
}
.detail-backdrop{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:999}
.detail-backdrop.show{display:block}
.panel-close{position:absolute;top:16px;right:24px;background:none;border:none;font-size:24px;cursor:pointer;color:#888}
.section{margin-bottom:24px}
.section h4{font-size:14px;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.section h3{font-size:15px;margin-bottom:8px;color:#1a1a2e}
.contrib-list{list-style:none}
.contrib-item{display:flex;justify-content:space-between;padding:8px 12px;background:#f8f9fb;border-radius:6px;margin-bottom:6px;font-size:13px}
.contrib-item .impact{font-weight:600;color:#c0392b}
.anomaly-row{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:6px;margin-bottom:4px;font-size:13px}
.anomaly-row .sev{width:8px;height:8px;border-radius:50%}
.sev-high{background:#c0392b}
.sev-medium{background:#e67e22}
.loading{text-align:center;padding:60px;color:#888}
.empty{text-align:center;padding:40px;color:#aaa;font-size:14px}
.tab-bar{display:flex;gap:12px;margin-bottom:20px}
.tab{background:#f0f0f0;border:none;padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;color:#666}
.tab.active{background:#1a1a2e;color:#fff}
.schedule-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px}
.schedule-grid .area-label{font-weight:600;color:#555;padding:6px 0}
.schedule-grid .area-people{display:flex;flex-wrap:wrap;gap:4px}
.people-tag{padding:2px 8px;border-radius:4px;font-size:11px;background:#eef1f7;color:#555}
.auth-panel{max-width:360px;margin:80px auto;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:32px}
.auth-panel h2{font-size:18px;margin-bottom:20px}
.auth-panel input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:12px}
.auth-panel button{width:100%;padding:10px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.auth-panel .error{color:#c0392b;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div id="login-panel" class="auth-panel">
  <h2>门店经营诊断</h2>
  <input id="token-input" type="password" placeholder="输入 HRMS 管理 token">
  <button onclick="login()">进入</button>
  <div id="login-error" class="error"></div>
  <p style="font-size:11px;color:#aaa;margin-top:12px">从浏览器 localStorage 获取 hrms_token</p>
</div>

<div id="main-panel" style="display:none">
  <div class="header">
    <div><h1>门店经营诊断</h1></div>
    <div class="period">
      <input id="start-date" type="date" value="2026-06-15" style="padding:4px 8px;border:1px solid rgba(255,255,255,.3);border-radius:4px;background:rgba(255,255,255,.1);color:#fff;margin-right:8px">
      <span>至</span>
      <input id="end-date" type="date" value="2026-06-22" style="padding:4px 8px;border:1px solid rgba(255,255,255,.3);border-radius:4px;background:rgba(255,255,255,.1);color:#fff;margin-left:8px;margin-right:12px">
      <button onclick="refresh()" style="padding:5px 14px;background:rgba(255,255,255,.2);border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:13px">刷新</button>
    </div>
  </div>
  <div class="container" id="stores-container"></div>
</div>

<div class="detail-backdrop" id="backdrop" onclick="closeDetail()"></div>
<div class="detail-panel" id="detail-panel">
  <button class="panel-close" onclick="closeDetail()">×</button>
  <div id="detail-content"></div>
</div>

<script>
const API_BASE = window.location.origin;
let token = null;

function login() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  token = t;
  // Test token
  fetch(API_BASE + '/api/diagnosis/overview?start=2026-06-15&end=2026-06-21', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(r => {
    if (r.status === 401) {
      document.getElementById('login-error').textContent = 'Token 无效或已过期';
      return;
    }
    document.getElementById('login-panel').style.display = 'none';
    document.getElementById('main-panel').style.display = 'block';
    refresh();
  }).catch(e => {
    document.getElementById('login-error').textContent = '连接失败: ' + e.message;
  });
}

// Auto-try localStorage token
try {
  const stored = localStorage.getItem('hrms_token');
  if (stored) {
    document.getElementById('token-input').value = stored;
  }
} catch(_){}

async function refresh() {
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  const container = document.getElementById('stores-container');
  container.innerHTML = '<div class="loading">⏳ 正在加载诊断数据...</div>';

  try {
    const res = await fetch(`${API_BASE}/api/diagnosis/overview?start=${start}&end=${end}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'unknown');
    renderStores(data.stores, start, end);
  } catch(e) {
    container.innerHTML = `<div class="empty">❌ 加载失败: ${e.message}<br><br><button onclick="refresh()">重试</button></div>`;
  }
}

function renderStores(stores, start, end) {
  const container = document.getElementById('stores-container');
  if (!stores || stores.length === 0) {
    container.innerHTML = '<div class="empty">暂无诊断数据</div>';
    return;
  }

  container.innerHTML = stores.map(s => {
    const declineClass = s.revenue.is_decline ? 'badge-red' : 'badge-green';
    const changeClass = s.revenue.change_pct >= 0 ? 'change-up' : 'change-down';
    const changeSign = s.revenue.change_pct >= 0 ? '+' : '';

    const anomalyTags = s.anomalies.map(a =>
      `<span class="issue-tag ${a.severity === 'high' ? 'issue-high' : 'issue-medium'}">${a.type}</span>`
    ).join('');

    const contribChips = (s.revenue.contributions || []).slice(0, 6).map(c => {
      const good = isGoodFactor(c.factor);
      return `<span class="issue-tag" style="background:${good ? '#e8f8e8' : '#fde8e8'};color:${good ? '#2d8a3e' : '#c0392b'}">${c.factor} ${c.impact}</span>`;
    }).join('');

    const recs = s.recommendations.slice(0, 3).map(r =>
      `<div class="rec-item">
        <span class="rec-icon">${r.priority === 'high' ? '🔴' : '🟡'}</span>
        <span>${r.title}</span>
      </div>`
    ).join('');

    return `<div class="store-card" onclick="openDetail('${encodeURIComponent(s.store)}', '${start}', '${end}')">
      <h3>${s.store} <span class="badge ${declineClass}">${declineClass === 'badge-red' ? '营收下降' : '营收正常'}</span></h3>
      <div class="headline">${s.summary.headline || ''}</div>
      <div class="metrics">
        <div class="metric"><div class="value">¥${(s.revenue.total || 0).toLocaleString()}</div><div class="label">本期营收 <span class="${changeClass}">${changeSign}${s.revenue.change_pct}%</span></div></div>
        <div class="metric"><div class="value">${s.summary.new_customer_ratio || '-'}</div><div class="label">新客占比</div></div>
        <div class="metric"><div class="value">${s.anomalies.length}</div><div class="label">异常项</div></div>
        <div class="metric"><div class="value">${s.recommendations.length}</div><div class="label">建议项</div></div>
      </div>
      <div class="issues">${contribChips}</div>
      <div class="issues">${anomalyTags}</div>
      <div class="recommendations">${recs}</div>
    </div>`;
  }).join('');
}

async function openDetail(storeEncoded, start, end) {
  const store = decodeURIComponent(storeEncoded);
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('detail-panel').classList.add('show');
  document.getElementById('detail-content').innerHTML = '<div class="loading">⏳ 加载详情...</div>';

  try {
    const res = await fetch(`${API_BASE}/api/diagnosis/store/${storeEncoded}?start=${start}&end=${end}`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'unknown');
    renderDetail(data.diagnosis);
  } catch(e) {
    document.getElementById('detail-content').innerHTML = `<div class="empty">❌ 加载失败: ${e.message}</div>`;
  }
}

function isGoodFactor(factor) {
  if (/增长|提升|上升/.test(factor)) return true;
  if (factor === '差评下降' || factor === '桌访问题产品下降') return true;
  return false;
}

function renderDetail(d) {
  const contribHTML = (d.revenue.contributions || []).length > 0
    ? `<div class="section">
        <h4>📊 贡献度分析（全维度环比）</h4>
        <ul class="contrib-list">${d.revenue.contributions.map(c =>
          `<li class="contrib-item"><span>${c.factor}</span><span class="impact" style="color:${isGoodFactor(c.factor) ? '#2d8a3e' : '#c0392b'}">${c.impact}</span></li>
           <li style="font-size:11px;color:#999;padding:0 12px 6px;margin-top:-6px">${c.detail}</li>`
        ).join('')}</ul>
      </div>`
    : '';

  const catHTML = (d.revenue.categories || []).length > 0
    ? `<div class="section">
        <h4>🍽️ 品类营收</h4>
        <ul class="contrib-list">${d.revenue.categories.slice(0, 6).map(c =>
          `<li class="contrib-item"><span>${c.name}</span><span>¥${c.avg_daily.toLocaleString()}/天</span></li>`
        ).join('')}</ul>
      </div>`
    : '';

  const anomHTML = d.anomalies.map(a =>
    `<div class="anomaly-row">
      <span class="sev ${a.severity === 'high' ? 'sev-high' : 'sev-medium'}"></span>
      <span style="flex:1">${a.type}</span>
      <span style="color:#888;font-size:11px">${a.detail || ''}</span>
    </div>`
  ).join('');

  const recHTML = d.recommendations.map(r =>
    `<div class="rec-item">
      <span class="rec-icon">${r.priority === 'high' ? '🔴' : '🟡'}</span>
      <div>
        <div style="font-weight:500;margin-bottom:2px">${r.title}</div>
        <div style="color:#888;font-size:11px">${r.detail || ''}</div>
        ${r.target_users ? `<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${r.target_users.map(u => `<span class="people-tag">${u}</span>`).join('')}</div>` : ''}
      </div>
    </div>`
  ).join('');

  const newCustomerStats = d.customer.total_orders > 0
    ? `<div><span style="font-size:24px;font-weight:700">${d.customer.new_ratio}%</span><br><span style="font-size:11px;color:#888">新客占比（${d.customer.new_customers}新 / ${d.customer.total_orders}总）</span></div>`
    : '';

  const staffAreas = Object.entries(d.staffing.by_area || {}).map(([area, people]) =>
    `<div>
      <div class="area-label">${area}</div>
      <div class="area-people">${people.map(p => `<span class="people-tag">${p.name}</span>`).join('')}</div>
    </div>`
  ).join('');

  document.getElementById('detail-content').innerHTML = `
    <h2 style="font-size:20px;margin-bottom:8px">${d.store}</h2>
    <div style="color:#888;font-size:13px;margin-bottom:24px">${d.summary.headline}</div>

    <div class="section">
      <h4>💰 营业指标</h4>
      <div class="metrics">
        <div class="metric"><div class="value">¥${d.revenue.total.toLocaleString()}</div><div class="label">本期营收 <span class="${d.revenue.change_pct >= 0 ? 'change-up' : 'change-down'}">${d.revenue.change_pct >= 0 ? '+' : ''}${d.revenue.change_pct}%</span></div></div>
        <div class="metric"><div class="value">¥${d.revenue.avg_order_value.toLocaleString()}</div><div class="label">客单价</div></div>
        <div class="metric"><div class="value">¥${d.revenue.avg_efficiency.toLocaleString()}</div><div class="label">人效（元/人）</div></div>
        ${newCustomerStats ? '<div class="metric">'+newCustomerStats+'</div>' : ''}
      </div>
    </div>

    ${contribHTML}
    ${catHTML}

    <div class="section">
      <h4>🔴 本周异常（${d.anomalies.length}项）</h4>
      ${anomHTML || '<div style="color:#888;font-size:13px">无异常</div>'}
    </div>

    <div class="section">
      <h4>👥 最新排班（${d.staffing.latest_date || '-'}）</h4>
      <div class="schedule-grid">${staffAreas || '<div style="color:#888;font-size:13px">无排班数据</div>'}</div>
    </div>

    <div class="section">
      <h4>💡 建议行动（${d.recommendations.length}项）</h4>
      ${recHTML || '<div style="color:#888;font-size:13px">暂无建议</div>'}
    </div>

    <div class="section">
      <h4>👤 未培训员工（${d.training.employees_without_training.length}人）</h4>
      <div class="area-people">${d.training.employees_without_training.map(e => `<span class="people-tag">${e.name} (${e.position || '-'}${e.is_new ? ' · 新' : ''})</span>`).join('')}</div>
    </div>
  `;
}

// Date picker sync
document.getElementById('start-date').addEventListener('change', refresh);
document.getElementById('end-date').addEventListener('change', refresh);

function closeDetail() {
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('detail-panel').classList.remove('show');
}
</script>
</body>
</html>
